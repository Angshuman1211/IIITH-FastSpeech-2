# FastSpeech 2 configuration for English (Svarah).
#
# Svarah is an ASR evaluation benchmark rather than a TTS corpus: roughly 117
# speakers over 9.6 h, with no single speaker holding anywhere near 5 h. It is
# therefore trained as a multi-speaker model with a speaker embedding table,
# and synthesis picks one reference speaker. See notes/decisions.md.
#
# If speaker identity cannot be recovered from the filenames, set
# multi_speaker to False and rerun prepare_svarah.py with --speaker-mode single.

preprocess:
  dataset: "English"

  path:
    corpus_path: "../../data/svarah"
    lexicon_path: "../../lexicon/librispeech-lexicon.txt"
    raw_path: "../../raw_data/English"
    textgrid_path: "../../mfa_data/textgrids_english"
    preprocessed_path: "../../preprocessed/English"

  preprocessing:
    val_size: 649
    text:
      text_cleaners: ["english_cleaners"]
      language: "en"
    audio:
      sampling_rate: 22050
      max_wav_value: 32768.0
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    mel:
      n_mel_channels: 80
      mel_fmin: 0
      mel_fmax: 8000
    pitch:
      feature: "phoneme_level"
      normalization: True
    energy:
      feature: "phoneme_level"
      normalization: True

model:
  transformer:
    encoder_layer: 4
    encoder_head: 2
    encoder_hidden: 256
    decoder_layer: 6
    decoder_head: 2
    decoder_hidden: 256
    conv_filter_size: 1024
    conv_kernel_size: [9, 1]
    encoder_dropout: 0.2
    decoder_dropout: 0.2

  variance_predictor:
    filter_size: 256
    kernel_size: 3
    dropout: 0.5

  variance_embedding:
    pitch_quantization: "linear"
    energy_quantization: "linear"
    n_bins: 256

  multi_speaker: True        # Svarah has many speakers and no dominant one

  max_seq_len: 1000

  vocoder:
    model: "HiFi-GAN"
    speaker: "universal"     # not LJSpeech: this is many Indian-accented voices

train:
  path:
    ckpt_path: "./checkpoints"
    log_path: "../../logs/English"
    result_path: "../../output/result/English"

  optimizer:
    batch_size: 16
    betas: [0.9, 0.98]
    eps: 0.000000001
    weight_decay: 0.0
    grad_clip_thresh: 1.0
    grad_acc_step: 1
    warm_up_step: 4000
    anneal_steps: [30000, 50000, 70000]
    anneal_rate: 0.3

  step:
    total_step: 80000
    log_step: 100
    synth_step: 2000
    val_step: 1000
    save_step: 10000
